[project]
name = "hermes-omni"
version = "0.2.0"
description = "Hybrid Autonomous Agent OS with LiteLLM Local Gateway, LangGraph Orchestration, Git Worktrees and Reflexion Loop"
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.35",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "rich>=13.8.0",
    "filelock>=3.16.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "faster-whisper>=1.0.3",
    "redis>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py312"
