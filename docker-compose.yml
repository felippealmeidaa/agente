services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni_user
      POSTGRES_PASSWORD: omni_pass
      POSTGRES_DB: omni_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_user -d omni_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
